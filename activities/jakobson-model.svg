</g>
<g fill="#513c29" font-family="Georgia, serif" font-size="25" text-anchor="middle">
<text x="380" y="137">Context</text>
<text x="116" y="259">Addresser</text>
<text x="380" y="259">Message</text>
<text x="644" y="259">Addressee</text>
