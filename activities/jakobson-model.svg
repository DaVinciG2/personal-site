<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc">
<title id="title">Jakobson’s model of communication</title>
<desc id="desc">An addresser sends a message to an addressee. Context, contact, and a shared code make communication possible. Gold cards highlight the four factors used in the AILATO adaptation, where Contact is represented by the Channel module.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#89633f" stroke-width="1.5"/></marker></defs>
