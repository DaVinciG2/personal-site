<text x="380" y="73" font-family="Arial, sans-serif" font-size="16">Six factors in an act of communication</text>
</g>
<g fill="none" stroke="#b79670" stroke-width="2" stroke-dasharray="5 6">
<path d="M380 188V222 M380 310V344 M380 432V466"/>
