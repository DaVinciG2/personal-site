<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A journey through a shifting landscape of clouds." />
    <title>Cloud Train</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./scene.js"></script>
  </head>
  <body>
    <button class="about-button theme-button" type="button" aria-haspopup="dialog">about me</button>
    <main class="scene" aria-label="Cloud train scene">
      <div class="scene-intro">
        <h1 class="scene-quote quote-intro">We live in the gap of<br class="desktop-break"> reality and fantasy.</h1>
        <a class="scroll-cue" href="#landscape" aria-label="Scroll to the landscape">↓</a>
      </div>
      <section class="scene-landscape" id="landscape" aria-label="Animated cloud landscape with a train">
        <canvas aria-label="A train crossing a bridge through layers of moving clouds" role="img"></canvas>
        <div class="landscape-message">
          <h2 class="scene-quote quote-landscape">Life is a journey of<br class="desktop-break"> cognition and implementation</h2>
          <button class="next-scene theme-button" type="button" aria-label="Go to scene 2"><span aria-hidden="true">→</span></button>
          <div class="quote-clouds" aria-hidden="true">
            <div class="cloud-layer quote-cloud" data-cover-cloud="true"><canvas class="cloud-bank cloud-left" data-seed="90" aria-hidden="true"></canvas></div>
            <div class="cloud-layer quote-cloud" data-cover-cloud="true"><canvas class="cloud-bank cloud-left" data-seed="91" aria-hidden="true"></canvas></div>
            <div class="cloud-layer quote-cloud" data-cover-cloud="true"><canvas class="cloud-bank cloud-right" data-seed="92" aria-hidden="true"></canvas></div>
          </div>
        </div>
        <p class="status" role="status">Loading landscape…</p>
      </section>
      <div class="parting-clouds" aria-hidden="true">
        <div class="cloud-layer"><canvas class="cloud-bank cloud-left" data-seed="1" aria-hidden="true"></canvas></div>
        <div class="cloud-layer"><canvas class="cloud-bank cloud-right" data-seed="2" aria-hidden="true"></canvas></div>
        <div class="cloud-layer"><canvas class="cloud-bank cloud-left" data-seed="3" aria-hidden="true"></canvas></div>
        <div class="cloud-layer"><canvas class="cloud-bank cloud-right" data-seed="4" aria-hidden="true"></canvas></div>
        <div class="cloud-layer"><canvas class="cloud-bank cloud-left" data-seed="5" aria-hidden="true"></canvas></div>
        <div class="cloud-layer"><canvas class="cloud-bank cloud-right" data-seed="6" aria-hidden="true"></canvas></div>
        <div class="cloud-layer"><canvas class="cloud-bank cloud-left" data-seed="7" aria-hidden="true"></canvas></div>
        <div class="cloud-layer"><canvas class="cloud-bank cloud-right" data-seed="8" aria-hidden="true"></canvas></div>
        <div class="cloud-layer"><canvas class="cloud-bank cloud-left" data-seed="9" aria-hidden="true"></canvas></div>
        <div class="cloud-layer"><canvas class="cloud-bank cloud-right" data-seed="10" aria-hidden="true"></canvas></div>
        <div class="cloud-layer"><canvas class="cloud-bank cloud-left" data-seed="11" aria-hidden="true"></canvas></div>
        <div class="cloud-layer"><canvas class="cloud-bank cloud-right" data-seed="12" aria-hidden="true"></canvas></div>
        <div class="cloud-layer"><canvas class="cloud-bank cloud-left" data-seed="13" aria-hidden="true"></canvas></div>
        <div class="cloud-layer"><canvas class="cloud-bank cloud-right" data-seed="14" aria-hidden="true"></canvas></div>
        <div class="cloud-layer"><canvas class="cloud-bank cloud-left" data-seed="15" aria-hidden="true"></canvas></div>
        <div class="cloud-layer"><canvas class="cloud-bank cloud-right" data-seed="16" aria-hidden="true"></canvas></div>
        <div class="cloud-layer"><canvas class="cloud-bank cloud-left" data-seed="17" aria-hidden="true"></canvas></div>
        <div class="cloud-layer"><canvas class="cloud-bank cloud-right" data-seed="18" aria-hidden="true"></canvas></div>
        <div class="cloud-layer"><canvas class="cloud-bank cloud-left" data-seed="19" aria-hidden="true"></canvas></div>
        <div class="cloud-layer"><canvas class="cloud-bank cloud-right" data-seed="20" aria-hidden="true"></canvas></div>
        <div class="cloud-layer"><canvas class="cloud-bank cloud-left" data-seed="21" aria-hidden="true"></canvas></div>
        <div class="cloud-layer"><canvas class="cloud-bank cloud-right" data-seed="22" aria-hidden="true"></canvas></div>
        <div class="cloud-layer"><canvas class="cloud-bank cloud-left" data-seed="23" aria-hidden="true"></canvas></div>
        <div class="cloud-layer"><canvas class="cloud-bank cloud-right" data-seed="24" aria-hidden="true"></canvas></div>
      </div>
    </main>
    <section class="scene-two" aria-label="Scene 2" hidden><h1 tabindex="-1">scene2</h1></section>
    <dialog class="about-dialog" aria-labelledby="about-title">
      <article class="about-card">
        <button class="close-about" type="button" aria-label="Close about me">×</button>
        <p class="card-eyebrow">A LITTLE INTRODUCTION</p>
        <h2 id="about-title">about me</h2>
        <p class="about-copy">We live in the gap of reality and fantasy.</p>
      </article>
    </dialog>
    <div class="cloud-transition" aria-hidden="true"><div class="cloud-curtain"></div></div>
  </body>
</html>
